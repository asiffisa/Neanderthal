<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="rocketFire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#090a0f"/>
  <!-- Speed lines -->
  <line x1="80" y1="180" x2="160" y2="180" stroke="#ffffff" stroke-width="2" opacity="0.3" stroke-dasharray="8,8"/>
  <line x1="60" y1="140" x2="130" y2="140" stroke="#ffffff" stroke-width="2.5" opacity="0.4" stroke-dasharray="10,6"/>
  <line x1="90" y1="100" x2="150" y2="100" stroke="#ffffff" stroke-width="2" opacity="0.3" stroke-dasharray="6,6"/>
  <!-- Rocket Body -->
  <path d="M 270 140 C 270 140, 200 110, 170 110 L 170 170 C 200 170, 270 140, 270 140 Z" fill="#e2e8f0"/>
  <!-- Rocket Cockpit Window -->
  <circle cx="215" cy="140" r="10" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <!-- Thruster Flame -->
  <polygon points="170,125 125,140 170,155" fill="url(#rocketFire)"/>
  <!-- Label Tag -->
  <rect x="20" y="245" width="125" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="32" y="266" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SHIP FAST</text>
</svg>
