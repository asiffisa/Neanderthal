<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="25%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#030712"/>
  <!-- Transparent Gelatinous Bell -->
  <ellipse cx="200" cy="140" rx="65" ry="90" fill="#ffffff" fill-opacity="0.06" stroke="#93c5fd" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- 8 Iridescent Ciliary Comb Rows -->
  <path d="M 160 80 Q 150 140 160 200" stroke="url(#rainbow)" stroke-width="3" fill="none" stroke-dasharray="3,3"/>
  <path d="M 180 65 Q 170 140 180 215" stroke="url(#rainbow)" stroke-width="3.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M 220 65 Q 230 140 220 215" stroke="url(#rainbow)" stroke-width="3.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M 240 80 Q 250 140 240 200" stroke="url(#rainbow)" stroke-width="3" fill="none" stroke-dasharray="3,3"/>
  <!-- Label Tag -->
  <rect x="20" y="245" width="135" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="32" y="266" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">COMB JELLY</text>
</svg>
