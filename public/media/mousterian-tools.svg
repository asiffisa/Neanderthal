<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="100%" stop-color="#080706"/>
    </linearGradient>
    <linearGradient id="flint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="40%" stop-color="#4b5563"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Mousterian Levallois Flake Point -->
  <polygon points="200,45 255,225 200,215 145,225" fill="url(#flint)" stroke="#d1d5db" stroke-width="2"/>
  <!-- Facet flaking scars -->
  <path d="M 200 45 L 200 215" stroke="#111827" stroke-width="2.5"/>
  <path d="M 200 85 L 165 150 L 200 170 L 235 150 Z" fill="#374151" stroke="#9ca3af" stroke-width="1.5" opacity="0.6"/>
  <path d="M 145 225 L 175 190 L 200 215" stroke="#111827" stroke-width="2"/>
  <path d="M 255 225 L 225 190 L 200 215" stroke="#111827" stroke-width="2"/>
  <!-- Retouched cutting edge highlights -->
  <path d="M 200 45 L 145 225" stroke="#e5e7eb" stroke-width="2.5" stroke-dasharray="4,2"/>
  <path d="M 200 45 L 255 225" stroke="#e5e7eb" stroke-width="2.5" stroke-dasharray="4,2"/>
  <!-- Badge Label -->
  <rect x="20" y="245" width="165" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="32" y="266" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MOUSTERIAN FLINT</text>
</svg>
