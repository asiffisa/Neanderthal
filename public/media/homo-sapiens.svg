<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#080a0e"/>
    </linearGradient>
    <linearGradient id="bone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f4"/>
      <stop offset="60%" stop-color="#d6d3d1"/>
      <stop offset="100%" stop-color="#a8a29e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Homo sapiens cranium (High rounded globular vault, vertical forehead, distinct chin) -->
  <path d="M 130 185 C 115 160, 110 130, 125 95 C 145 50, 235 45, 275 80 C 305 110, 310 155, 290 180 C 270 195, 245 190, 235 185 C 215 200, 195 230, 160 235 C 145 238, 140 215, 135 195 Z" fill="url(#bone)" stroke="#44403c" stroke-width="3"/>
  <ellipse cx="160" cy="140" rx="22" ry="24" fill="#0c0a09"/>
  <!-- Distinct Chin (Mental Protuberance) -->
  <circle cx="160" cy="232" r="5" fill="#e7e5e4"/>
  <!-- High Forehead Highlight -->
  <path d="M 135 90 Q 185 65 245 75" stroke="#fafaf9" stroke-width="4" fill="none" opacity="0.8"/>
  <!-- Label Tag -->
  <rect x="20" y="245" width="145" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="32" y="266" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HOMO SAPIENS</text>
</svg>
