<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#3b1d07"/>
    </linearGradient>
    <linearGradient id="lit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="80" cy="50" r="1.5" fill="#fef08a"/>
  <circle cx="280" cy="40" r="2" fill="#fef08a"/>
  <circle cx="340" cy="80" r="1" fill="#fef08a"/>
  <!-- Pyramid Face (Lit) -->
  <polygon points="200,60 110,230 200,230" fill="url(#lit)"/>
  <!-- Pyramid Face (Shaded) -->
  <polygon points="200,60 200,230 310,230" fill="url(#shade)"/>
  <!-- Golden Electrum Capstone -->
  <polygon points="200,60 185,85 200,85" fill="#fef08a"/>
  <polygon points="200,60 200,85 215,85" fill="#f59e0b"/>
  <!-- Ground Horizon -->
  <rect x="0" y="230" width="400" height="70" fill="#291404"/>
  <!-- Label Tag -->
  <rect x="20" y="245" width="165" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="32" y="266" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">GREAT PYRAMID</text>
</svg>
