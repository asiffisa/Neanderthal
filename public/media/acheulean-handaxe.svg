<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="flint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="50%" stop-color="#8b6508"/>
      <stop offset="100%" stop-color="#553d03"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Teardrop bifacial handaxe -->
  <path d="M 200 40 C 240 100, 270 170, 250 220 C 230 250, 170 250, 150 220 C 130 170, 160 100, 200 40 Z" fill="url(#flint)" stroke="#daa520" stroke-width="2.5"/>
  <!-- Flaking scars -->
  <path d="M 200 65 L 180 110 L 200 135 L 220 110 Z" fill="#6b4e05" opacity="0.6"/>
  <path d="M 180 140 L 155 180 L 185 200 L 210 165 Z" fill="#6b4e05" opacity="0.5"/>
  <path d="M 215 140 L 245 180 L 215 200 Z" fill="#6b4e05" opacity="0.5"/>
  <!-- Label Tag -->
  <rect x="20" y="245" width="180" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
  <text x="32" y="266" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1">ACHEULEAN HANDAXE</text>
</svg>
